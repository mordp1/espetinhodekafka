apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: admin
  labels:
    strimzi.io/cluster: my-cluster
spec:
  # No .spec.authorization: the "CN=admin" principal is already listed in
  # Kafka.spec.kafka.authorization.superUsers, so the authorizer doesn't even
  # evaluate ACLs for it — full access by definition.
  authentication:
    type: tls
