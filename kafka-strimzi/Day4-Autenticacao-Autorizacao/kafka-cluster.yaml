apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: my-cluster
spec:
  kafka:
    version: 4.3.0
    metadataVersion: 4.3-IV0
    # No "plain" listener: in production, every client-facing listener requires TLS + authentication.
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
      - name: scram
        port: 9094
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    # type: simple resolves, in a KRaft cluster, to Kafka's native StandardAuthorizer
    # (org.apache.kafka.metadata.authorizer.StandardAuthorizer) — no Zookeeper, no legacy AclAuthorizer.
    authorization:
      type: simple
      superUsers:
        - CN=admin
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
