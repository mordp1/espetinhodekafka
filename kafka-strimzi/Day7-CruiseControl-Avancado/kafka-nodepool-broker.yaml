apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    strimzi.io/cluster: my-cluster
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: jbod
    # Two volumes per broker (vs one in Day 6) — a prerequisite for the intra-broker
    # (disk-to-disk) rebalancing in section 5: without multiple disks, "rebalanceDisk: true"
    # and "mode: remove-disks" have nothing to do.
    volumes:
      - id: 0
        type: persistent-claim
        size: 6Gi
        deleteClaim: true
        kraftMetadata: shared
      - id: 1
        type: persistent-claim
        size: 6Gi
        deleteClaim: true
