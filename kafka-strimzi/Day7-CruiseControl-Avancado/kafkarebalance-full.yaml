apiVersion: kafka.strimzi.io/v1
kind: KafkaRebalance
metadata:
  name: full-rebalance
  labels:
    strimzi.io/cluster: my-cluster
spec:
  # mode: full is the default (could be omitted) — left explicit for clarity in the video.
  # Explicit list of a subset of Cruise Control's default goals (see references
  # for the full list and the hard/soft order). Omitting spec.goals uses the
  # operator's cruiseControl.config.default.goals.
  goals:
    - RackAwareGoal
    - ReplicaCapacityGoal
    - DiskCapacityGoal
    - NetworkInboundCapacityGoal
    - NetworkOutboundCapacityGoal
    - CpuCapacityGoal
    - ReplicaDistributionGoal
    - DiskUsageDistributionGoal
    - NetworkInboundUsageDistributionGoal
    - NetworkOutboundUsageDistributionGoal
    - CpuUsageDistributionGoal
    - TopicReplicaDistributionGoal
    - LeaderReplicaDistributionGoal
