apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: shop.events
  labels:
    strimzi.io/cluster: my-cluster
spec:
  # Plenty of partitions on purpose: gives Cruise Control something real to redistribute
  # across brokers/disks in sections 8 to 10.
  partitions: 12
  replicas: 3
  config:
    retention.ms: 604800000
    segment.bytes: 1073741824
