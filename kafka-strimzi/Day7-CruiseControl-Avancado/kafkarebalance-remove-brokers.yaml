apiVersion: kafka.strimzi.io/v1
kind: KafkaRebalance
metadata:
  name: remove-brokers-rebalance
  labels:
    strimzi.io/cluster: my-cluster
spec:
  mode: remove-brokers
  # Same broker that joined via add-brokers-rebalance — Cruise Control moves all of its
  # replicas to the remaining brokers BEFORE you reduce the node pool's replicas,
  # avoiding the manual scale-down error we saw in Day 3.
  brokers:
    - 6
