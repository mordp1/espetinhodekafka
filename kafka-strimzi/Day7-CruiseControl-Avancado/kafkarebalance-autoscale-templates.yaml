# Templates referenced by spec.cruiseControl.autoRebalance in kafka-cluster.yaml
# (README section 17). These are not rebalance requests — the
# strimzi.io/rebalance-template: "true" annotation marks each one as base configuration that
# the Cluster Operator uses to BUILD a real KafkaRebalance on its own, at the moment
# you scale the KafkaNodePool. "mode" and "brokers" are filled in automatically
# by the operator at that point — don't declare these two fields here, they are ignored.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaRebalance
metadata:
  name: auto-add-brokers-template
  labels:
    strimzi.io/cluster: my-cluster
  annotations:
    strimzi.io/rebalance-template: "true"
spec:
  skipHardGoalCheck: false
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaRebalance
metadata:
  name: auto-remove-brokers-template
  labels:
    strimzi.io/cluster: my-cluster
  annotations:
    strimzi.io/rebalance-template: "true"
spec:
  skipHardGoalCheck: false
