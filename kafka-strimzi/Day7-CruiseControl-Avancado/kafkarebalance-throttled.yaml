apiVersion: kafka.strimzi.io/v1
kind: KafkaRebalance
metadata:
  name: throttled-rebalance
  labels:
    strimzi.io/cluster: my-cluster
spec:
  mode: full
  # Explicit and HEALTHY concurrency values — direct contrast with the real problem
  # reported in the Strimzi community (discussion #7167): setting these fields to 0 thinking
  # "0 = no limit" actually stalled an 82MB rebalance for over an hour.
  # 0 means "almost no concurrent movement allowed", not "unlimited". If you
  # don't know what value to use, it's safer to OMIT these fields and let Cruise Control
  # use the defaults (concurrentPartitionMovementsPerBroker=5,
  # concurrentIntraBrokerPartitionMovements=2, concurrentLeaderMovements=1000) than to
  # risk a value that's too low.
  concurrentPartitionMovementsPerBroker: 3
  concurrentIntraBrokerPartitionMovements: 1
  concurrentLeaderMovements: 200
  # 10MiB/s cap on bandwidth used moving replicas — protects production traffic
  # (producers/consumers) from competing with the rebalance itself for the network. Without
  # this, replicationThrottle has no upper limit.
  replicationThrottle: 10485760
  # replicaMovementStrategies is NOT here on purpose: testing live, including this
  # field (even with correct, valid class names in Cruise Control) makes the API
  # reject ANY rebalance request with "400 Bad Request" / "Failed to parse
  # parameters" — reproduced deterministically in this lab, isolated by removing fields
  # one by one until only this one was left. Without it, the rest of the throttling works normally.
  # See section 15 and section 19 (Known Issues) for details.
