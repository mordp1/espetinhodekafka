apiVersion: kafka.strimzi.io/v1
kind: KafkaRebalance
metadata:
  name: intra-broker-rebalance
  labels:
    strimzi.io/cluster: my-cluster
spec:
  mode: full
  # rebalanceDisk=true turns on the IntraBrokerDiskCapacityGoal / IntraBrokerDiskUsageDistribution
  # goal — it moves replicas BETWEEN THE SAME BROKER'S TWO DISKS (volumes id 0 and 1 of
  # kafka-nodepool-broker.yaml), not between brokers. Only works on JBOD storage with more
  # than one volume; until recently there was a bug (strimzi-kafka-operator#10280) that
  # rejected this on clusters using KafkaNodePool — fixed now, but it's worth checking the
  # operator version if you see "cluster does not have JBOD storage config" with JBOD
  # configured.
  rebalanceDisk: true
