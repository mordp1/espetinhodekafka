apiVersion: kafka.strimzi.io/v1
kind: KafkaRebalance
metadata:
  name: remove-disk-rebalance
  labels:
    strimzi.io/cluster: my-cluster
spec:
  mode: remove-disks
  # Empties volume id=1 of broker 0 (moving the largest replicas first to
  # volume id=0 and to the other brokers' disks), as a safe, prior step before
  # physically removing that disk later. brokerId here needs to be a real BROKER
  # ID — in this lab the "controller" node pool gets the higher IDs (3,4,5) and
  # "broker" gets the lower ones (0,1,2); using a controller ID here fails with
  # "IllegalArgumentException: Some/all brokers specified don't exist" (reproduced in this
  # lab). Adjust brokerId to match your node pool's real NODEIDS (see README section 6).
  moveReplicasOffVolumes:
    - brokerId: 0
      volumeIds: [1]
