apiVersion: kafka.strimzi.io/v1
kind: KafkaRebalance
metadata:
  name: disk-incident-rebalance
  labels:
    strimzi.io/cluster: my-cluster
spec:
  mode: full
  # Scenario: a disk almost full on a specific broker, right now, in production. We don't
  # want to wait for (or pay the network cost of) a full rebalance with all goals —
  # we want to fix ONLY disk, as fast as possible.
  goals:
    - DiskCapacityGoal
    - DiskUsageDistributionGoal
  # Without this, the proposal fails: the cluster's hard.goals (RackAwareGoal,
  # ReplicaCapacityGoal, the two network ones, CpuCapacityGoal, etc.) must appear in
  # the list of executed goals — not just the disk goal. skipHardGoalCheck=true is what
  # allows running only the two goals above. Explicit trade-off: we accept not checking
  # rack/network/CPU/etc. in THIS run to fix the disk emergency now; the
  # follow-up is a full kafkarebalance-full.yaml once the incident is over.
  # See README section 13 for the full rationale.
  skipHardGoalCheck: true
  # Protects the financial topic from being touched by an emergency rebalance —
  # no payments.* replica should move just because another broker's disk is
  # full.
  excludedTopics: "payments\\..*"
