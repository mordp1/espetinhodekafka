# Multi-topic workload to simulate a real domain (e-commerce) and generate
# heterogeneous imbalance across brokers: throughput, retention, message size,
# and replication factor vary on purpose between topics. See section 8 of the README for
# the rationale behind each topic and the load commands.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: orders.created
  labels:
    strimzi.io/cluster: my-cluster
spec:
  # Compacted topic: each key is an order-id, value is the order's most recent state.
  # Disk doesn't grow linearly with throughput — the log cleaner shrinks old
  # segments. Good contrast with the "append-only" topics below when interpreting
  # what Cruise Control is actually balancing (bytes on disk NOW, not historical
  # ingestion rate).
  partitions: 6
  replicas: 3
  config:
    cleanup.policy: compact
    min.cleanable.dirty.ratio: "0.5"
    segment.bytes: 268435456
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: payments.processed
  labels:
    strimzi.io/cluster: my-cluster
spec:
  # min.insync.replicas stricter than the cluster default (2): financial topic,
  # low volume on purpose. Used later, in Day 7, to show how excludedTopics
  # protects a critical topic from being touched by a hastily triggered rebalance.
  partitions: 6
  replicas: 3
  config:
    min.insync.replicas: 3
    retention.ms: 604800000
    segment.bytes: 268435456
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: clickstream.raw
  labels:
    strimzi.io/cluster: my-cluster
spec:
  # The lab's "hot" topic on purpose: more partitions (24) and higher throughput than
  # any other — it's the one that will dominate disk/network on some brokers and give
  # Cruise Control something real to fix via DiskUsageDistributionGoal /
  # NetworkInboundUsageDistributionGoal. Short retention (2 days) because raw clickstream
  # is normally consumed and aggregated quickly by a stream processor.
  partitions: 24
  replicas: 3
  config:
    retention.ms: 172800000
    segment.bytes: 1073741824
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: inventory.updates
  labels:
    strimzi.io/cluster: my-cluster
spec:
  # RF 2 on purpose (vs RF 3 elsewhere) — shows that Cruise Control handles
  # heterogeneous replication factor across topics in the same cluster well.
  partitions: 8
  replicas: 2
  config:
    retention.ms: 259200000
    segment.bytes: 268435456
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: audit.logs
  labels:
    strimzi.io/cluster: my-cluster
spec:
  # Few partitions and low throughput, but 30-day retention with large messages:
  # disk grows from RETENTION, not from ingestion rate. Direct contrast with
  # clickstream.raw (high throughput, short retention) — two different ways for a
  # topic to become "heavy" on disk, and Cruise Control only sees the end result
  # (bytes on disk now), not the cause.
  partitions: 4
  replicas: 3
  config:
    retention.ms: 2592000000
    segment.bytes: 268435456
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: notifications.push
  labels:
    strimzi.io/cluster: my-cluster
spec:
  # Practically idle topic on purpose — a "cold" baseline to contrast with
  # clickstream.raw when looking at the optimization proposal's result.
  partitions: 6
  replicas: 3
  config:
    retention.ms: 259200000
    segment.bytes: 268435456
