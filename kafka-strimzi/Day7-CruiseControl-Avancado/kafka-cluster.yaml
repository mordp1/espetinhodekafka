apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: my-cluster
spec:
  kafka:
    version: 4.3.0
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
  cruiseControl:
    config:
      # The 5 anomaly types of the Anomaly Detector — see section 16. In this Day we enable
      # broker failure (same as the Day 6 basics) AND goal violation AND disk failure, so we
      # have real self-healing to demonstrate. metric.anomaly and topic.anomaly
      # are left disabled on purpose (see the caveats in section 16).
      self.healing.broker.failure.enabled: "true"
      self.healing.goal.violation.enabled: "true"
      self.healing.disk.failure.enabled: "true"
      self.healing.metric.anomaly.enabled: "false"
      self.healing.topic.anomaly.enabled: "false"
    # brokerCapacity: without this, Cruise Control assumes 1 CPU CORE per broker (issue
    # strimzi-kafka-operator#5951) and upstream's network defaults (10000KiB/s = ~10MB/s
    # per broker) — unrealistic even for a local kind cluster, and low enough to break
    # NetworkInboundCapacityGoal with the load burst from section 7 (reproduced and documented
    # in section 12; the same category of bug as the "1 core" CPU one, just for network).
    brokerCapacity:
      cpu: "2"
      inboundNetwork: 200000KiB/s
      outboundNetwork: 200000KiB/s
      # Per-broker overrides: useful when the hardware is heterogeneous (e.g., a node pool
      # running on bigger instances than the others). In kind the 3 workers are
      # physically identical — this here illustrates the SYNTAX, not a real fix
      # for asymmetry in this local lab. IMPORTANT: the ID here needs to be a real
      # broker — in this lab the "controller" node pool gets the higher IDs (3,4,5) and
      # "broker" gets the lower ones (0,1,2); using a controller ID (e.g., 3) here doesn't
      # error out on apply, but the override simply doesn't apply to any real
      # broker (reproduced in this lab). Check the real NODEIDS of the broker node pool
      # before assuming which ID to use (section 6).
      overrides:
        - brokers: [0]
          cpu: "4"
          inboundNetwork: 400000KiB/s
          outboundNetwork: 400000KiB/s
    # autoRebalance is NOT enabled here on purpose — we reproduce live what
    # happens if it's already turned on at the initial deploy: on the first "kubectl scale
    # kafkanodepool broker --replicas=4", the operator triggers add-brokers on its own BEFORE
    # you can apply the manual kafkarebalance-add-brokers.yaml from section 9 — the
    # manual add-brokers/remove-brokers demonstration never gets to run the way it's
    # documented. autoRebalance is enabled only in section 17, via "kubectl edit"/
    # patch, after sections 8-16 have already run the manual flow.
