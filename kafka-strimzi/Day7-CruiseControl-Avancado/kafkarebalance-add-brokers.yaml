apiVersion: kafka.strimzi.io/v1
kind: KafkaRebalance
metadata:
  name: add-brokers-rebalance
  labels:
    strimzi.io/cluster: my-cluster
spec:
  mode: add-brokers
  # ID of the new broker after "kubectl scale kafkanodepool broker --replicas=4".
  # Confirm the real value with "kubectl get kafkanodepool broker -n kafka" before applying —
  # 6 is expected following the sequential numbering observed in the previous Days.
  brokers:
    - 6
