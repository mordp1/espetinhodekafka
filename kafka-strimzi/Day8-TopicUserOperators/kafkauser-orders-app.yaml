apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: orders-app
  labels:
    strimzi.io/cluster: my-cluster
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: orders.
          patternType: prefix
        operations:
          - Write
          - Read
          - Describe
      - resource:
          type: group
          name: orders-app-
          patternType: prefix
        operations:
          - Read
