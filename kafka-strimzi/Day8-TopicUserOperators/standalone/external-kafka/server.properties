# A "legacy" Kafka OUTSIDE Kubernetes: single node KRaft, SASL/SCRAM-SHA-512 + ACLs.
# It stands for: a VM, bare metal, MSK, Confluent Cloud, Aiven... anything the standalone
# Topic/User Operators can reach over the network with an Admin API connection.
process.roles=broker,controller
node.id=1
# The controller listener only exists on 127.0.0.1 inside the container (never reachable from the
# pods), so its PLAINTEXT/ANONYMOUS traffic is local-only.
controller.quorum.voters=1@127.0.0.1:9093

listeners=SASL_PLAINTEXT://:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=SASL_PLAINTEXT://external-kafka:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=SASL_PLAINTEXT

sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
listener.name.sasl_plaintext.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="admin-secret";

# ACLs on (needed by the User Operator) and a bootstrap superuser. Everything else is deny-by-default.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
# User:ANONYMOUS = the local-only CONTROLLER listener talking to itself (single-node combined mode).
super.users=User:admin;User:ANONYMOUS
allow.everyone.if.no.acl.found=false

# Same recommendation as in-cluster: the Topic Operator should be the only thing creating topics.
auto.create.topics.enable=false

offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
log.dirs=/tmp/kraft-logs
