apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: payments.events
  labels:
    strimzi.io/cluster: external-kafka   # matches STRIMZI_RESOURCE_LABELS of the standalone operator
spec:
  partitions: 3
  replicas: 1                            # the external lab broker is a single node
  config:
    retention.ms: 259200000
