apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: my-cluster
spec:
  kafka:
    version: 4.3.0
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # Enables Cruise Control, natively managed by Strimzi: the operator brings up the
  # Cruise Control deployment, injects the Metrics Reporter into the brokers, and creates
  # the internal topics it uses to store metric samples and the cluster's load model.
  # This Day doesn't generate load or run any KafkaRebalance — it's just the introduction.
  # Capacity planning (brokerCapacity) and full self-healing come in Day 7, once the cluster
  # has real traffic to optimize.
  cruiseControl:
    config:
      self.healing.broker.failure.enabled: "true"
