apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: my-cluster
spec:
  kafka:
    version: 4.3.0
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # Habilita o Cruise Control gerenciado nativamente pelo Strimzi: o operator sobe o
  # deployment do Cruise Control, injeta o Metrics Reporter nos brokers e cria os tópicos
  # internos que ele usa para guardar amostras de métricas e o modelo de carga do cluster.
  # Este Day não gera carga nem executa nenhum KafkaRebalance — é só a introdução. Capacity
  # planning (brokerCapacity) e self-healing completo entram no Day 7, quando o cluster
  # passa a ter tráfego de verdade pra otimizar.
  cruiseControl:
    config:
      self.healing.broker.failure.enabled: "true"
