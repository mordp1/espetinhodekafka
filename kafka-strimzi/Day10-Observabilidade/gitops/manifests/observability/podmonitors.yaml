# PodMonitor = "scrape the pods that match this selector". Prometheus Operator turns each one into scrape_configs.
# These four cover the Strimzi side. The demo apps ship their OWN PodMonitor next to their Deployments (manifests/demo-apps).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-resources-metrics
  labels: { app: strimzi }
spec:
  selector:
    matchExpressions:
      - { key: strimzi.io/kind, operator: In, values: [Kafka] }     # brokers/controllers AND the Kafka Exporter pod
  namespaceSelector:
    matchNames: [kafka]
  podMetricsEndpoints:
    - path: /metrics
      port: tcp-prometheus
      # The Strimzi dashboards filter by these labels (kubernetes_namespace, strimzi_io_cluster, kubernetes_pod_name ...)
      relabelings:
        - { action: labelmap, regex: "__meta_kubernetes_pod_label_(strimzi_io_.+)", replacement: "$1" }
        - { action: replace, sourceLabels: [__meta_kubernetes_namespace], targetLabel: namespace }
        - { action: replace, sourceLabels: [__meta_kubernetes_namespace], targetLabel: kubernetes_namespace }
        - { action: replace, sourceLabels: [__meta_kubernetes_pod_name], targetLabel: kubernetes_pod_name }
        - { action: replace, sourceLabels: [__meta_kubernetes_pod_node_name], targetLabel: node_name }
        - { action: replace, sourceLabels: [__meta_kubernetes_pod_host_ip], targetLabel: node_ip }
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cluster-operator-metrics
  labels: { app: strimzi }
spec:
  selector:
    matchLabels: { strimzi.io/kind: cluster-operator }
  namespaceSelector:
    matchNames: [strimzi-operator]
  podMetricsEndpoints:
    - { path: /metrics, port: http }
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: entity-operator-metrics
  labels: { app: strimzi }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: entity-operator }
  namespaceSelector:
    matchNames: [kafka]
  podMetricsEndpoints:
    - { path: /metrics, port: healthcheck-to }    # Topic Operator
    - { path: /metrics, port: healthcheck-uo }    # User Operator
