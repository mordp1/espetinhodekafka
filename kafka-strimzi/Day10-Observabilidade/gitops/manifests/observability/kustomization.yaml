# Everything in this folder is OBSERVABILITY AS CODE. ArgoCD renders it with kustomize; Prometheus/Alertmanager/Grafana
# discover it by labels, in any namespace. No UI click, no config reload, no "who changed that dashboard".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  # --- same layout as the official Strimzi examples/metrics folder (see README, section 6) ---
  - prometheus-install/pod-monitors/cluster-operator-metrics.yaml
  - prometheus-install/pod-monitors/entity-operator-metrics.yaml
  - prometheus-install/pod-monitors/kafka-resources-metrics.yaml
  - prometheus-install/pod-monitors/bridge-metrics.yaml
  - prometheus-install/prometheus-rules/prometheus-kafka-rules.yaml
  - prometheus-install/prometheus-rules/prometheus-kafka-exporter-topic-rules-group.yaml
  - prometheus-install/prometheus-rules/prometheus-strimzi-cluster-operator-rules.yaml
  - prometheus-install/prometheus-rules/prometheus-strimzi-entity-operator-rules.yaml
  - prometheus-install/prometheus-rules/prometheus-kafka-bridge-rules.yaml
  - prometheus-install/prometheus-rules/prometheus-kafka-certificate-rules.yaml
  - kube-state-metrics/configmap.yaml
  - kube-state-metrics/ksm.yaml
  - kube-state-metrics/prometheus-rules.yaml
  # --- lab additions (not in the official folder) ---
  - prometheus-install/prometheus-rules/prometheus-e2e-pipeline-rules.yaml
  - prometheus-alertmanager-config/alert-manager-config.yaml
  - prometheus-alertmanager-config/alert-webhook.yaml
  - grafana-install/grafana-datasource-tempo.yaml

# One ConfigMap per dashboard JSON; the Grafana sidecar loads anything labelled grafana_dashboard=1 and puts it in the folder
# named by the grafana_folder annotation. disableNameSuffixHash: keep the name stable (the sidecar does not care about the hash).
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: dashboard-strimzi-kafka
    files: [grafana-dashboards/strimzi-kafka.json]
    options: { annotations: { grafana_folder: Strimzi } }
  - name: dashboard-strimzi-kraft
    files: [grafana-dashboards/strimzi-kraft.json]
    options: { annotations: { grafana_folder: Strimzi } }
  - name: dashboard-strimzi-kafka-exporter
    files: [grafana-dashboards/strimzi-kafka-exporter.json]
    options: { annotations: { grafana_folder: Strimzi } }
  - name: dashboard-strimzi-operators
    files: [grafana-dashboards/strimzi-operators.json]
    options: { annotations: { grafana_folder: Strimzi } }
  - name: dashboard-strimzi-kafka-bridge
    files: [grafana-dashboards/strimzi-kafka-bridge.json]
    options: { annotations: { grafana_folder: Strimzi } }
  - name: dashboard-e2e-pipeline
    files: [grafana-dashboards/e2e-pipeline.json]
    options: { annotations: { grafana_folder: Pipeline } }
