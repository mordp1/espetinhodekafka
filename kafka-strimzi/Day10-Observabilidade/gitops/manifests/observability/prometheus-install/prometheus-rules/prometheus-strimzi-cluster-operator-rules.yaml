# Official file name: prometheus-strimzi-cluster-operator-rules.yaml (Strimzi 1.1.0 examples/metrics).
# Lab differences: kube-state-metrics signal instead of cAdvisor `container_last_seen`, and the team label used for routing.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels: { role: alert-rules, app: strimzi }
  name: strimzi-cluster-operator-rules
spec:
  groups:
    - name: cluster-operator
      rules:
        - alert: StrimziClusterOperatorDown
          expr: kube_deployment_status_replicas_available{namespace="strimzi-operator", deployment="strimzi-cluster-operator"} < 1
          for: 2m
          labels: { severity: critical, team: kafka-platform }
          annotations:
            summary: "The Strimzi Cluster Operator has no available replica"
            description: "Kafka keeps running, but no change (config, scale, cert renewal, rolling update) is applied until it is back."
