# Based on the official file examples/metrics/prometheus-install/prometheus-rules/prometheus-kafka-bridge-rules.yaml (Strimzi 1.1.0). Lab changes:
#   * team label for routing; "Bridge down" uses kube-state-metrics instead of cAdvisor `container_last_seen`
#   * Http4xx/Http5xx use increase() over 5m: the official rule compares the COUNTER itself (`..._total > 10`), which stays true
#     forever after the 11th error and never resolves
#   * REMOVED AvgProducerLatency / AvgConsumerFetchLatency / AvgConsumerCommitLatency: they read strimzi_bridge_kafka_* metrics that
#     did NOT exist in this lab (Bridge 1.0.0 exposed only strimzi_bridge_http_server_* and JVM metrics, with both the Strimzi Metrics
#     Reporter and the JMX exporter). An alert on a metric that never exists is silent forever - worse than no alert.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    role: alert-rules
    app: strimzi
  name: kafka-bridge
spec:
  groups:
    - name: kafka-bridge
      rules:
        - alert: BridgeContainersDown
          expr: kube_deployment_status_replicas_available{namespace="kafka", deployment=~".+-bridge"} < 1
          for: 1m
          labels: { severity: critical, team: kafka-platform }
          annotations:
            summary: "Kafka Bridge {{ $labels.deployment }} has no available replica"
            description: "HTTP clients cannot produce or consume until it is back."
        - alert: Http4xxErrorRate
          expr: sum by (code, path) (increase(strimzi_bridge_http_server_requests_total{code=~"^4..$", path!="/favicon.ico"}[5m])) > 10
          for: 1m
          labels: { severity: warning, team: kafka-platform }
          annotations:
            summary: "Kafka Bridge returned {{ $value | printf \"%.0f\" }} HTTP {{ $labels.code }} in 5 min for {{ $labels.path }}"
            description: "Client errors: wrong Content-Type, unknown topic/consumer, bad payload. Usually a client bug, not a Kafka problem."
        - alert: Http5xxErrorRate
          expr: sum by (code, path) (increase(strimzi_bridge_http_server_requests_total{code=~"^5..$", path!="/favicon.ico"}[5m])) > 10
          for: 1m
          labels: { severity: warning, team: kafka-platform }
          annotations:
            summary: "Kafka Bridge returned {{ $value | printf \"%.0f\" }} HTTP {{ $labels.code }} in 5 min for {{ $labels.path }}"
            description: "Server errors: the Bridge could not reach Kafka (brokers down, NotEnoughReplicas, timeouts)."
