# Official file: examples/metrics/prometheus-install/pod-monitors/bridge-metrics.yaml (Strimzi 1.1.0).
# Lab change: namespaceSelector (myproject -> kafka). The management/metrics port of the Bridge is `rest-api-mgmt`.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: bridge-metrics
  labels:
    app: strimzi
spec:
  selector:
    matchLabels:
      strimzi.io/kind: KafkaBridge
  namespaceSelector:
    matchNames:
      - kafka
  podMetricsEndpoints:
    - path: /metrics
      port: rest-api-mgmt
