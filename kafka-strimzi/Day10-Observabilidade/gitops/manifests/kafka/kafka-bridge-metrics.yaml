# Official file: examples/metrics/strimzi-metrics-reporter/kafka-bridge-metrics.yaml (Strimzi 1.1.0) + two lab additions:
#   * bootstrapServers points at the lab cluster (my-cluster) and the namespace-local Service
#   * tracing (OpenTelemetry): the Bridge continues the trace of the HTTP request (traceparent header) and injects it into the
#     Kafka record, so  HTTP client -> Bridge -> orders -> processor -> sink  is ONE trace. Endpoint/service name go in env vars.
apiVersion: kafka.strimzi.io/v1
kind: KafkaBridge
metadata:
  name: my-bridge
spec:
  replicas: 1
  bootstrapServers: my-cluster-kafka-bootstrap:9092
  http:
    port: 8080
  metricsConfig:
    type: strimziMetricsReporter           # same plugin as the brokers: no ConfigMap with JMX rules
  tracing:
    type: opentelemetry
  template:
    bridgeContainer:
      env:
        - { name: OTEL_SERVICE_NAME, value: my-bridge }
        - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://tempo.monitoring.svc:4317" }
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }
