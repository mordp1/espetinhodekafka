# The ONLY thing applied by hand ("app of apps"). It watches gitops/apps/ and creates every child Application found there.
# From here on, the cluster is whatever Git says it is: add/remove a file in apps/ and ArgoCD follows.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-root
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: http://git-server.git.svc/cgi-bin/git/observability.git   # in real life: your GitHub/GitLab URL
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true        # deleting a file from apps/ removes the child Application (and what it deployed)
      selfHeal: true
