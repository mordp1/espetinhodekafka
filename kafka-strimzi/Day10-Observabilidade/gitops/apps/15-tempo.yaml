# Wave 1: Grafana Tempo (traces), single-binary mode, in-memory-ish local storage. Receives OTLP from the apps on :4317 (gRPC) / :4318 (HTTP).
# Production: tempo-distributed or Grafana Cloud, object storage, and an OpenTelemetry Collector in between (see README, section "Indo para produção").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: observability
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.4
    helm:
      releaseName: tempo
      valuesObject:
        tempo:
          # Metrics generator: Tempo turns SPANS into METRICS and remote-writes them to Prometheus (needs enableRemoteWriteReceiver there).
          #   service-graphs -> traces_service_graph_*  (the service map)      span-metrics -> traces_spanmetrics_*  (latency per span)
          #   local-blocks   -> TraceQL metrics         ({ ... } | quantile_over_time(duration, .95))
          metricsGenerator:
            enabled: true
            remoteWriteUrl: http://kps-kube-prometheus-stack-prometheus.monitoring:9090/api/v1/write
            processor:
              service_graphs: { wait: 10s }
              span_metrics: { dimensions: [messaging.destination.name] }
              local_blocks: { flush_to_storage: true, filter_server_spans: false }   # false: keep INTERNAL spans too (e.g. "validate and enrich order")
          overrides:
            defaults:
              metrics_generator:
                processors: [service-graphs, span-metrics, local-blocks]
          retention: 6h                   # LAB: the lab emits ~5 traces/s non-stop; short retention keeps Tempo's memory bounded
          resources:
            requests: { cpu: 50m, memory: 384Mi }
            limits: { memory: 1536Mi }    # 768Mi was OOMKilled after ~5h of continuous traffic (5 restarts in 25h)
        persistence: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
