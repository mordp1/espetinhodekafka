# Unit tests for the alerts: we INVENT the metric series and assert what Alertmanager would receive.
# Run with ci/validate.sh. Add a test whenever you add (or fix) an alert - that is the whole point of "alerts as code".
rule_files:
  - rules.yml          # generated by validate.sh from the rendered PrometheusRule CRs
evaluation_interval: 15s

tests:
  # ------------------------------------------------------------------------------------------------ broker alerts
  - name: under-replicated partitions that persist page the platform team
    interval: 15s
    input_series:
      - series: 'kafka_server_replicamanager_underreplicatedpartitions{namespace="kafka", kubernetes_pod_name="my-cluster-dual-role-1"}'
        values: '0 0 4 4 4 4 4 4'              # 0,0 then 4 from t=30s on
    alert_rule_test:
      - eval_time: 45s                          # URP for only 15s: still inside "for: 30s" -> pending, NOT firing
        alertname: KafkaUnderReplicatedPartitions
        exp_alerts: []
      - eval_time: 90s                          # URP for 60s -> firing
        alertname: KafkaUnderReplicatedPartitions
        exp_alerts:
          - exp_labels: { severity: warning, team: kafka-platform, namespace: kafka, kubernetes_pod_name: my-cluster-dual-role-1 }
            exp_annotations:
              summary: "4 under-replicated partitions on my-cluster-dual-role-1"
              description: "A follower is not in sync. Normal for ~1 min during a rolling restart; if it persists a broker is down, slow or its disk is full."

  - name: a healthy cluster stays quiet
    interval: 15s
    input_series:
      - series: 'kafka_server_replicamanager_underreplicatedpartitions{namespace="kafka", kubernetes_pod_name="my-cluster-dual-role-0"}'
        values: '0x10'
      - series: 'kafka_controller_kafkacontroller_activecontrollercount{namespace="kafka", kubernetes_pod_name="my-cluster-dual-role-0"}'
        values: '1x10'
      - series: 'kafka_controller_kafkacontroller_activecontrollercount{namespace="kafka", kubernetes_pod_name="my-cluster-dual-role-1"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: KafkaUnderReplicatedPartitions
        exp_alerts: []
      - eval_time: 2m
        alertname: KafkaAbnormalControllerState      # sum over brokers == 1 -> fine (this is why the rule SUMS)
        exp_alerts: []

  # ------------------------------------------------------------------------------------------------ consumer lag
  - name: consumer lag is summed per group and topic (ONE alert, not one per partition)
    interval: 15s
    input_series:
      - series: 'kafka_consumergroup_lag{consumergroup="order-processor", topic="orders", partition="0"}'
        values: '700x10'
      - series: 'kafka_consumergroup_lag{consumergroup="order-processor", topic="orders", partition="1"}'
        values: '700x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: KafkaConsumerGroupLagHigh
        exp_alerts:
          - exp_labels: { severity: warning, team: kafka-platform, consumergroup: order-processor, topic: orders }
            exp_annotations:
              summary: "Group order-processor is 1400 messages behind on orders"
              description: "The consumer is slower than the producer, stuck, or down. Compare with the consume-rate panel before scaling."

  # ------------------------------------------------------------------------------------------------ business alerts
  - name: the pipeline is stalled when orders are produced but nothing reaches the sink
    interval: 15s
    input_series:
      - series: 'demo_messages_produced_total{topic="orders"}'
        values: '0+75x20'                       # +75 every 15s = 5 msg/s
      - series: 'demo_messages_consumed_total{stage="sink", topic="orders.processed"}'
        values: '0+75x4 300x16'                 # flows for 1 minute, then FREEZES
    alert_rule_test:
      - eval_time: 1m
        alertname: OrderPipelineStalled
        exp_alerts: []
      - eval_time: 5m
        alertname: OrderPipelineStalled
        exp_alerts:
          - exp_labels: { severity: critical, team: kafka-platform }
            exp_annotations:
              summary: "Orders are being produced but NOTHING reaches the sink"
              description: "Check consumer-group lag, then the processor/sink pods, then the trace of a recent order in Tempo."

  - name: nothing is stalled when nothing is being produced (no false page at 3 a.m. on a quiet system)
    interval: 15s
    input_series:
      - series: 'demo_messages_produced_total{topic="orders"}'
        values: '5x20'
      - series: 'demo_messages_consumed_total{stage="sink", topic="orders.processed"}'
        values: '5x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: OrderPipelineStalled
        exp_alerts: []

  - name: high p95 end-to-end latency
    interval: 15s
    input_series:
      # every observation lands in the le="5" bucket -> p95 is between 2.5s and 5s
      - series: 'demo_end_to_end_latency_seconds_bucket{le="2.5"}'
        values: '0x30'
      - series: 'demo_end_to_end_latency_seconds_bucket{le="5"}'
        values: '0+15x30'
      - series: 'demo_end_to_end_latency_seconds_bucket{le="+Inf"}'
        values: '0+15x30'
    alert_rule_test:
      - eval_time: 6m
        alertname: OrderPipelineEndToEndLatencyHigh
        exp_alerts:
          - exp_labels: { severity: warning, team: kafka-platform }
            exp_annotations:
              summary: "p95 end-to-end latency is 4.9s (SLO: 2s)"
              description: "Open a slow trace in Tempo: the longest span (or the gap BETWEEN spans = time sitting in a topic) shows where the time goes."

  # ------------------------------------------------------------------------------------------------ one root cause = one alert
  - name: an unavailable broker makes MANY partitions under-replicated, but the exporter alert is one per topic
    interval: 15s
    input_series:
      - series: 'kafka_topic_partition_under_replicated_partition{topic="orders", partition="0"}'
        values: '1x10'
      - series: 'kafka_topic_partition_under_replicated_partition{topic="orders", partition="1"}'
        values: '1x10'
      - series: 'kafka_topic_partition_under_replicated_partition{topic="orders", partition="2"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: KafkaExporterTopicUnderReplicated
        exp_alerts:                              # ONE alert for three partitions
          - exp_labels: { severity: warning, team: kafka-platform, topic: orders }
            exp_annotations:
              summary: "orders has 3 under-replicated partitions"

  # ------------------------------------------------------------------------------------------------ kube-state-metrics (Strimzi CRs)
  - name: a KafkaTopic that the Topic Operator could not apply is reported by kube-state-metrics
    interval: 15s
    input_series:
      - series: 'strimzi_kafka_topic_resource_info{name="orders.audit", topicName="orders.audit", ready="False"}'
        values: '1x10'
      - series: 'strimzi_kafka_topic_resource_info{name="orders", topicName="orders", ready="True"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: KafkaTopicNotReady
        exp_alerts:
          - exp_labels: { severity: warning, team: kafka-platform, name: orders.audit, topicName: orders.audit, ready: "False" }
            exp_annotations:
              message: "Strimzi KafkaTopic orders.audit is not ready"

  # ------------------------------------------------------------------------------------------------ Kafka Bridge
  - name: a burst of HTTP 4xx from the Bridge alerts, and resolves once the burst is over (increase(), not the raw counter)
    interval: 15s
    input_series:
      - series: 'strimzi_bridge_http_server_requests_total{code="415", path="/topics/orders"}'
        values: '0+2x20 40x40'                   # 2 errors per 15 s for 5 min (= 40), then it STOPS
    alert_rule_test:
      - eval_time: 4m
        alertname: Http4xxErrorRate
        exp_alerts:
          - exp_labels: { severity: warning, team: kafka-platform, code: "415", path: "/topics/orders" }
            exp_annotations:
              summary: "Kafka Bridge returned 32 HTTP 415 in 5 min for /topics/orders"
              description: "Client errors: wrong Content-Type, unknown topic/consumer, bad payload. Usually a client bug, not a Kafka problem."
      - eval_time: 14m                           # counter is still 40 (> 10) but nothing new happened: must NOT fire
        alertname: Http4xxErrorRate
        exp_alerts: []
