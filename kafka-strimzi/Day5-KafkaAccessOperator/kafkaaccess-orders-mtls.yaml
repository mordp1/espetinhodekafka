# Second KafkaAccess in the same team-orders namespace, now for the mTLS user
# orders-mtls. Here the listener is explicit (tls) — it isn't required (the operator
# would also figure it out on its own, since only the "tls" listener accepts tls
# authentication), but we leave it explicit so the error example in section 13 makes
# sense by comparison.
#
# secretName customizes the name of the generated Secret (by default it would match
# the KafkaAccess name, "orders-mtls-access"). template.secret.metadata lets you
# annotate/label the generated Secret — here we use it to mark the Secret for the
# Stakater Reloader (reloader.stakater.com/match: "true"), which automatically restarts
# any Deployment with the matching annotation when the Secret's content changes — which
# closes the credential rotation cycle with no human intervention (section 14).
apiVersion: access.strimzi.io/v1alpha1
kind: KafkaAccess
metadata:
  name: orders-mtls-access
spec:
  kafka:
    name: my-cluster
    namespace: kafka
    listener: tls
  user:
    kind: KafkaUser
    apiGroup: kafka.strimzi.io
    name: orders-mtls
    namespace: kafka
  secretName: orders-mtls-binding
  template:
    secret:
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
        labels:
          team: orders
