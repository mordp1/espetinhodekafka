# Second application, now consuming the mTLS binding (orders-mtls-binding). It proves
# two things at once: (1) that the mTLS binding arrives ready to use without PKCS12
# — modern Kafka (>= 2.7, KIP-651) reads the certificate + PEM key directly via
# ssl.keystore.type=PEM; and (2) that the orders-mtls ACL (Read on orders.* +
# consumer group orders-consumer-) still applies, with no extra configuration
# in the Access Operator — it only delivers the credential, while what it's allowed
# to do is still decided by Kafka's StandardAuthorizer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-consumer-app
  labels:
    app: orders-consumer-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-consumer-app
  template:
    metadata:
      labels:
        app: orders-consumer-app
    spec:
      volumes:
        - name: kafka-binding
          secret:
            # Custom name, defined in spec.secretName of the KafkaAccess orders-mtls-access.
            secretName: orders-mtls-binding
      containers:
        - name: consumer
          image: quay.io/strimzi/kafka:1.1.0-kafka-4.3.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              BIND=/bindings/kafka

              # ssl.keystore.type=PEM accepts a single file with the CERTIFICATE block
              # and the PRIVATE KEY block concatenated — that's what Kafka's PEM parser
              # (DefaultSslEngineFactory.FileBasedPemStore) expects.
              cat "$BIND/ssl.keystore.crt" "$BIND/ssl.keystore.key" > /tmp/keystore.pem

              cat > /tmp/client.properties <<EOF
              security.protocol=$(cat "$BIND/security.protocol")
              ssl.truststore.type=PEM
              ssl.truststore.location=$BIND/ssl.truststore.crt
              ssl.keystore.type=PEM
              ssl.keystore.location=/tmp/keystore.pem
              EOF

              BOOTSTRAP=$(cat "$BIND/bootstrap.servers")
              echo "Conectando em $BOOTSTRAP via mTLS"

              exec bin/kafka-console-consumer.sh \
                --bootstrap-server "$BOOTSTRAP" \
                --topic orders.events \
                --group orders-consumer-app \
                --from-beginning \
                --property print.key=true \
                --consumer.config /tmp/client.properties
          volumeMounts:
            - name: kafka-binding
              mountPath: /bindings/kafka
              readOnly: true
