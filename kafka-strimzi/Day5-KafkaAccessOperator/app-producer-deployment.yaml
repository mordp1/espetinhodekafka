# A "real" application (a Deployment, not a loose debug pod) running in the
# team's namespace (team-orders), mounting the Secret generated by the KafkaAccess
# "orders-producer-access" as a volume — exactly the Service Binding
# Specification convention: each Secret key becomes a file at
# $SERVICE_BINDING_ROOT/<binding>/<key>. Frameworks like Spring Cloud Bindings or
# Quarkus would read this on their own; here we build client.properties by hand to
# make explicit what's inside the binding.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-producer-app
  labels:
    app: orders-producer-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-producer-app
  template:
    metadata:
      labels:
        app: orders-producer-app
    spec:
      volumes:
        - name: kafka-binding
          secret:
            # Default Secret name = KafkaAccess name (we don't set spec.secretName
            # in kafkaaccess-orders-scram.yaml).
            secretName: orders-producer-access
      containers:
        - name: producer
          image: quay.io/strimzi/kafka:1.1.0-kafka-4.3.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              BIND=/bindings/kafka

              cat > /tmp/client.properties <<EOF
              security.protocol=$(cat "$BIND/security.protocol")
              sasl.mechanism=$(cat "$BIND/sasl.mechanism")
              sasl.jaas.config=$(cat "$BIND/sasl.jaas.config")
              ssl.truststore.type=PEM
              ssl.truststore.location=$BIND/ssl.truststore.crt
              EOF

              BOOTSTRAP=$(cat "$BIND/bootstrap.servers")
              echo "Conectando em $BOOTSTRAP como $(cat "$BIND/username")"

              i=0
              while true; do
                printf 'order-%s:{"orderId":%s,"status":"created"}\n' "$i" "$i" | \
                  bin/kafka-console-producer.sh \
                    --bootstrap-server "$BOOTSTRAP" \
                    --topic orders.events \
                    --property "parse.key=true" \
                    --property "key.separator=:" \
                    --producer.config /tmp/client.properties
                i=$((i + 1))
                sleep 5
              done
          volumeMounts:
            - name: kafka-binding
              mountPath: /bindings/kafka
              readOnly: true
