# The KafkaAccess lives in the team's namespace (team-orders), but points to a Kafka
# and a KafkaUser that live in the "kafka" namespace — hence the kafka.namespace / user.namespace
# fields. Without them, the operator would assume the KafkaAccess's own namespace
# (team-orders), and would find neither the Kafka nor the KafkaUser there.
#
# spec.kafka.listener is left unspecified on purpose: with a single SCRAM KafkaUser
# referenced, the operator filters the Kafka CR's listeners for the ones whose authentication
# is compatible with scram-sha-512 — in this cluster only the "scram" listener matches, so
# it's chosen automatically (rule 2 of automatic listener selection).
apiVersion: access.strimzi.io/v1alpha1
kind: KafkaAccess
metadata:
  name: orders-producer-access
spec:
  kafka:
    name: my-cluster
    namespace: kafka
  user:
    kind: KafkaUser
    apiGroup: kafka.strimzi.io
    name: producer-orders
    namespace: kafka
