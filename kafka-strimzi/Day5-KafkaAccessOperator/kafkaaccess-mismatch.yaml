# NEGATIVE example, on purpose: it points to the "tls" listener (mTLS) but references
# the KafkaUser producer-orders, which is scram-sha-512. The Access Operator's KafkaParser
# validates compatibility between the listener's authentication and the KafkaUser's
# authentication before generating the Secret — here it fails, and the CR gets stuck at
# Ready=False with the message:
#   "Provided listener tls and Kafka User do not have compatible authentication
#    configurations."
# No Secret is created. See section 13 of the README for the diagnosis walkthrough.
apiVersion: access.strimzi.io/v1alpha1
kind: KafkaAccess
metadata:
  name: orders-mismatch-access
spec:
  kafka:
    name: my-cluster
    namespace: kafka
    listener: tls
  user:
    kind: KafkaUser
    apiGroup: kafka.strimzi.io
    name: producer-orders
    namespace: kafka
